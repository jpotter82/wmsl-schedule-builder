<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}skedworx{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="skedworx — schedules that work for your league.">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/skedworx.css') }}" rel="stylesheet">
  <style>
    body { background: var(--surface); }
    .auth-wrap { max-width: 430px; margin: 7vh auto 4vh; padding: 0 1rem; }
    .auth-card { border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); }
    .auth-top { text-align: center; margin-bottom: 1.25rem; }
    
    .auth-sub { color: var(--ink-600); font-size: .95rem; margin-top: .35rem; }
    .form-label { font-weight: 600; font-size: .92rem; }
    
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-top">
      {% with height = 46 %}{% include 'wordmark.html' %}{% endwith %}
      <div class="auth-sub">{% block subtitle %}{% endblock %}</div>
    </div>

    <div class="card auth-card">
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>

    <p class="text-center text-muted small mt-3">{% block footer %}{% endblock %}</p>
  </div>
</body>
</html>
