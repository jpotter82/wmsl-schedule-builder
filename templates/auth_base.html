<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}WMSL Schedule Builder{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .auth-wrap { max-width: 420px; margin: 8vh auto; }
    .auth-card { border: none; box-shadow: 0 2px 14px rgba(0,0,0,.08); }
    .auth-head { background: #1a5276; color: #fff; border-radius: .375rem .375rem 0 0; padding: 18px 24px; }
    .auth-head h1 { font-size: 1.25rem; margin: 0; font-weight: 600; }
    .auth-head p { margin: 4px 0 0; opacity: .85; font-size: .875rem; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-head">
        <h1>WMSL Schedule Builder</h1>
        <p>{% block subtitle %}{% endblock %}</p>
      </div>
      <div class="card-body p-4">
        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        {% block content %}{% endblock %}
      </div>
    </div>
    <p class="text-center text-muted small mt-3">{% block footer %}{% endblock %}</p>
  </div>
</body>
</html>
